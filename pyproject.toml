[project]
name = "swissparlpy"
authors = [{name = "Stefan Oderbolz", email = "odi@metaodi.ch"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
description = "Client for Swiss parliament API"
dependencies = [
    "requests",
    "pyodata>=1.11.1",
    "muzzle",
    "flatten-dict",
]

[project.optional-dependencies]
test = [
    "flake8",
    "mock",
    "responses",
    "pytest",
    "pytest-cov",
    "black[jupyter]>=24.0.0,<25.0.0",
    "matplotlib>=3.0.0",
    "pandas",
]
dev = [
    "jupyter",
    "black[jupyter]>=24.0.0,<25.0.0",
    "pre-commit",
    "mypy",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs",
    "marimo>=0.23.16",
]
visualization = [
    "matplotlib>=3.0.0",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Home = "https://github.com/metaodi/swissparlpy"

[tool.black]
target-version = ["py310", "py311", "py312"]

[tool.hatch.version]
path = "swissparlpy/__init__.py"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
addopts = "--cov=swissparlpy"

[tool.mypy]
# no explicit python_version: mypy parses the stubs of the installed
# packages with that target as well, and the numpy stubs of the newer
# Python versions use syntax of Python 3.12+ (PEP 695). The version of the
# running interpreter is used instead, the CI covers all supported versions.
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
pretty = true
