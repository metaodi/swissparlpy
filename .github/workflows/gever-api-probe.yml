name: Gever API probe

# Temporary, manually-triggered workflow to inspect the raw XML shape of the
# Gever (CMI CDWS) APIs from an environment that can actually reach them, to
# prototype the nested-record handling in swissparlpy/backends/gever.py.
# Not part of the regular CI, safe to delete once prototyping is done.

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Gever instance"
        type: choice
        options:
          - canton_zurich
          - city_zurich
        default: canton_zurich
      table:
        description: "Table (index) name"
        type: string
        default: mitglieder
      records:
        description: "Number of records to fetch"
        type: string
        default: "3"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve endpoint
        id: endpoint
        run: |
          case "${{ inputs.instance }}" in
            canton_zurich)
              base="https://parlzhcdws.cmicloud.ch"
              case "${{ inputs.table }}" in
                behoerden) path="/parlzh2/cdws/Index/BEHOERDEN" ;;
                sitzungendetail) path="/parlzh3/cdws/Index/SITZUNGENDETAIL" ;;
                geschaeft) path="/parlzh5/cdws/Index/GESCHAEFT" ;;
                mitglieder) path="/parlzh2/cdws/Index/MITGLIEDER" ;;
                parteien) path="/parlzh2/cdws/Index/PARTEIEN" ;;
                wahlkreise) path="/parlzh2/cdws/Index/WAHLKREISE" ;;
                direktion) path="/parlzh5/cdws/Index/GESCHAEFT_DIREKTION" ;;
                geschaeftsart) path="/parlzh5/cdws/Index/GESCHAEFT_GESCHAEFTSART" ;;
                gremiumtyp) path="/parlzh3/cdws/Index/GREMIUMTYP" ;;
                krversand) path="/parlzh1/cdws/Index/KRVERSAND" ;;
                ablaufschritte) path="/parlzh5/cdws/Index/ABLAUFSCHRITTE" ;;
                *) echo "Unknown canton_zurich table: ${{ inputs.table }}"; exit 1 ;;
              esac
              ;;
            city_zurich)
              base="https://www.gemeinderat-zuerich.ch"
              path="/api/${{ inputs.table }}"
              ;;
          esac
          echo "url=${base}${path}" >> "$GITHUB_OUTPUT"

      - name: Fetch schema
        run: |
          curl -sS \
            -H "user-agent: Mozilla Firefox Mozilla/5.0; metaodi swissparlpy (api-probe)" \
            "${{ steps.endpoint.outputs.url }}/schema" \
            -o schema.xml
          echo "=== SCHEMA (${{ steps.endpoint.outputs.url }}/schema) ==="
          python3 -c "
          import xml.dom.minidom as m
          print(m.parse('schema.xml').toprettyxml(indent='  '))
          "

      - name: Fetch searchdetails
        run: |
          curl -sS -G \
            -H "user-agent: Mozilla Firefox Mozilla/5.0; metaodi swissparlpy (api-probe)" \
            --data-urlencode "q=seq > 0" \
            --data-urlencode "l=de-CH" \
            --data-urlencode "m=${{ inputs.records }}" \
            --data-urlencode "s=1" \
            "${{ steps.endpoint.outputs.url }}/searchdetails" \
            -o data.xml
          echo "=== DATA (${{ steps.endpoint.outputs.url }}/searchdetails) ==="
          python3 -c "
          import xml.dom.minidom as m
          print(m.parse('data.xml').toprettyxml(indent='  '))
          "

      - name: Upload raw responses
        uses: actions/upload-artifact@v4
        with:
          name: gever-probe-${{ inputs.instance }}-${{ inputs.table }}
          path: |
            schema.xml
            data.xml
